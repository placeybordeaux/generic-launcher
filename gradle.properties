# Project-wide Gradle settings.

# AndroidX is required: all dependencies (appcompat, material, recyclerview,
# palette, cardview) are AndroidX artifacts.
android.useAndroidX=true

# Jetifier is unneeded — there are no legacy com.android.support dependencies.
android.enableJetifier=false

# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable Gradle's build cache.
org.gradle.caching=true

# Default emulated SDK for every Robolectric class that does not set @Config(sdk = ...).
#
# Robolectric's own default is the *package's* targetSdk, which is a trap: it silently
# re-points every unannotated test whenever targetSdk moves, and it fails outright once
# targetSdk passes the newest SDK Robolectric can emulate. Both happened here. Robolectric
# 4.14.1 tops out at SDK 35, so bumping the app to targetSdk 36 for Play's 2026 deadline
# broke every class with no @Config with
#
#     Package targetSdkVersion=36 > maxSdkVersion=35
#
# The rest
# already pin 33 explicitly. Pinning the default to match means a new test class inherits the
# suite's SDK rather than whatever the release target happens to be that month.
#
# This is deliberately NOT the app's targetSdk. Raising it means a Robolectric upgrade
# (4.15+ for SDK 36) and re-running the whole suite against different framework behaviour --
# worth doing, but on its own and not inside a release.
sdk=33
